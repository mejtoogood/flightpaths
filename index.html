<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YSCB RWY 35 Flight Paths</title>
  <script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.7.0/papaparse.min.js"></script>
</head>
<body>
  <main id="app">
    <div id="cesiumContainer"></div>
    <aside id="panel">
      <header>
        <h1>YSCB RWY 35</h1>
        <div class="sub">Approach from &lt;2,000 m · touchdown · rollout</div>
      </header>

      <section class="stats" aria-live="polite">
        <div><strong id="flightCount">—</strong><span>flights</span></div>
        <div><strong id="pointCount">—</strong><span>points</span></div>
      </section>

      <section>
        <label for="flightSelect">Flight</label>
        <select id="flightSelect"><option value="all">All RWY 35 landings</option></select>
      </section>

      <section>
        <div class="section-title">Equipment</div>
        <div id="equipmentFilters" class="checks"></div>
      </section>

      <section class="checks">
        <label><input id="showApproach" type="checkbox" checked> Approach</label>
        <label><input id="showRollout" type="checkbox" checked> Rollout</label>
        <label><input id="showTouchdown" type="checkbox" checked> Touchdown</label>
      </section>

      <section>
        <label for="exaggeration">Vertical exaggeration <span id="exaggerationValue">1×</span></label>
        <input id="exaggeration" type="range" min="1" max="5" step="0.5" value="1">
      </section>

      <section class="buttons">
        <button id="overviewBtn" type="button">Overview</button>
        <button id="runwayBtn" type="button">Runway</button>
      </section>

      <details>
        <summary>3D terrain</summary>
        <p>Optional Cesium ion public token. It stays in this browser and is not committed to GitHub.</p>
        <input id="ionToken" type="password" autocomplete="off" placeholder="Cesium ion token">
        <button id="terrainBtn" type="button">Enable world terrain</button>
        <div id="terrainStatus" class="status">Ellipsoid terrain</div>
      </details>

      <footer id="loadStatus">Loading flight data…</footer>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
